<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1418">
<title>TRU FISH</title>
<style>
:root{--bg:#0e1418;--ink:#e7f1f4;--dim:#9eb4bc;--line:#24343c;--water:#7ec8d4;--card:#162026;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--water)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0a1014;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--water);color:#0e1418;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--water);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>FISH</span></h1><p class="sub">Where they hold. Bait. Line. FM 21-76. Not a poison.</p></header>
<div class="warn">The law of the water you stand on is not in this file. A license, a season, and a limit are local. Poison and explosives are not packed. Teeth and spines cut.</div>
<div class="bar"><input id="q" placeholder="bait, line, night…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Where",d:"Fish where they gather, or in a run. At night a light draws them. In the day, shade draws some. On open water they sit under a raft or a boat. Watch for a school and move to it. Do not fish where large sharks are."},
{t:"Line",d:"Unravel threads from canvas or tarpaulin. Tie them in short lengths, in groups of three or more. A shoelace works. Parachute suspension line works. TRU Cord holds a join if the line must be longer."},
{t:"Bait",d:"Guts from fish, and from birds. A small fish for a larger one. Scoop the small ones with a cloth net, held under the water and lifted. Keep the bait moving so it looks alive."},
{t:"The take",d:"Be careful with teeth and spines. A large fish is not worth a boat. Cut it loose rather than risk the craft. Try for the small one. Do not punch a raft with a hook."},
{t:"A spear",d:"The manual says find a gather or a run, set the point in the water, move it slowly, then push and pin the fish to the bottom. Do not lift on the spear. It slips off. Hold the spear and take the fish with the other hand."},
{t:"Gap",d:"No poison, no rotenone, no plant that stuns a pool, no explosive, no chop. The manual names them. This ship does not. A hook you do not have is a gap, not a drawing. Clean water is TRU Water. A fire for the fish is TRU Fire, outside the shelter."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">FISH</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">FM 21-76: gather or run, thread line, bait kept moving, light at night, shade by day. Poison is not packed.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No poison.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
